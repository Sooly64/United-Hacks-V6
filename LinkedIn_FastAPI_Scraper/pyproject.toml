[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-scraper"
version = "0.1.0"
description = "LinkedIn profile scraper with AI analysis"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "openai"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
